  # ==================================================================
  # NOTIFICATION SERVICE
  # ==================================================================

  notification-service-dev:
    build:
      context: .
      dockerfile: ./apps/notification-service/Dockerfile
      target: production
    environment:
      - NODE_ENV=production
      - GRPC_HOST=${GRPC_HOST:-0.0.0.0}
      - GRPC_PORT=${GRPC_PORT:-50056}
      - EMAILJS_SERVICE_ID=${EMAILJS_SERVICE_ID}
      - EMAILJS_PUBLIC_KEY=${EMAILJS_PUBLIC_KEY}
      - EMAILJS_PRIVATE_KEY=${EMAILJS_PRIVATE_KEY}
      - EMAILJS_TEMPLATE_PROJECT_SUBMITTED_ID=${EMAILJS_TEMPLATE_PROJECT_SUBMITTED_ID}
      - EMAILJS_TEMPLATE_PROJECT_APPROVED_ID=${EMAILJS_TEMPLATE_PROJECT_APPROVED_ID}
      - EMAILJS_TEMPLATE_PROJECT_REJECTED_ID=${EMAILJS_TEMPLATE_PROJECT_REJECTED_ID}
      - EMAILJS_TEMPLATE_JUROR_INVITATION_ID=${EMAILJS_TEMPLATE_JUROR_INVITATION_ID}
      - EMAILJS_TEMPLATE_PASSWORD_CHANGED_ID=${EMAILJS_TEMPLATE_PASSWORD_CHANGED_ID}
      - EMAILJS_TEMPLATE_PASSWORD_RESET_ID=${EMAILJS_TEMPLATE_PASSWORD_RESET_ID}
      - EMAILJS_TEMPLATE_PLATFORM_INVITATION_ID=${EMAILJS_TEMPLATE_PLATFORM_INVITATION_ID}
