services:
  # PostgreSQL Database - Single instance with multiple databases
  postgres-dev:
    image: postgres:16-alpine
    command: postgres -p 5433
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      # Pass individual database passwords to init script
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      EVALUATION_DB_PASSWORD: ${EVALUATION_DB_PASSWORD}
      EVENT_DB_PASSWORD: ${EVENT_DB_PASSWORD}
      INVITATION_DB_PASSWORD: ${INVITATION_DB_PASSWORD}
      PROJECT_DB_PASSWORD: ${PROJECT_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    networks:
      - dokploy-network
    restart: unless-stopped
    ports:
      - "5433:5433"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -p 5433"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ==================================================================
  # AUTH SERVICE - Migration + Application
  # ==================================================================

  auth-migration-dev:
    build:
      context: .
      dockerfile: apps/auth-service/Dockerfile
      target: production
    environment:
      - DATABASE_URL=postgresql://auth_user:${AUTH_DB_PASSWORD}@postgres-dev:5433/auth_service
      - NODE_ENV=production
    depends_on:
      postgres-dev:
        condition: service_healthy
    networks:
      - dokploy-network
    command: >
      sh -c "prisma migrate deploy --schema=./apps/auth-service/prisma/schema.prisma &&
             node dist/apps/auth-service/prisma/seed.js"
    restart: "no"

  auth-service-dev:
    build:
      context: .
      dockerfile: apps/auth-service/Dockerfile
      target: production
    environment:
      - DATABASE_URL=postgresql://auth_user:${AUTH_DB_PASSWORD}@postgres-dev:5433/auth_service
      - GRPC_HOST=${GRPC_HOST:-0.0.0.0}
      - GRPC_PORT=${GRPC_PORT:-50051}
      - NODE_ENV=${NODE_ENV:-production}
      - JWT_PRIVATE_KEY=${JWT_PRIVATE_KEY}
      - JWT_REFRESH_PRIVATE_KEY=${JWT_REFRESH_PRIVATE_KEY}
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY}
      - JWT_REFRESH_PUBLIC_KEY=${JWT_REFRESH_PUBLIC_KEY}
      - JWT_ACCESS_TOKEN_EXPIRATION=${JWT_ACCESS_TOKEN_EXPIRATION:-15m}
      - JWT_REFRESH_TOKEN_EXPIRATION=${JWT_REFRESH_TOKEN_EXPIRATION:-7d}
      - JWT_REFRESH_TOKEN_EXPIRATION_DAYS=${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:-7}
      - NOTIFICATION_SERVICE_URL=${NOTIFICATION_SERVICE_URL}
      - PASSWORD_RESET_TOKEN_EXPIRY_MINUTES=${PASSWORD_RESET_TOKEN_EXPIRY_MINUTES:-15}
    depends_on:
      postgres-dev:
        condition: service_healthy
      auth-migration-dev:
        condition: service_completed_successfully
    networks:
      - dokploy-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('net').createConnection({port:50051}).on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # ==================================================================
  # EVALUATION SERVICE - Migration + Application
  # ==================================================================

  evaluation-migration-dev:
    build:
      context: .
      dockerfile: apps/evaluation-service/Dockerfile
      target: production
    environment:
      - DATABASE_URL=postgresql://evaluation_user:${EVALUATION_DB_PASSWORD}@postgres-dev:5433/evaluation_service
      - NODE_ENV=production
    depends_on:
      postgres-dev:
        condition: service_healthy
    networks:
      - dokploy-network
    command: prisma migrate deploy --schema=./apps/evaluation-service/prisma/schema.prisma
    restart: "no"

  evaluation-service-dev:
    build:
