      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # ==================================================================
  # REDIS
  # ==================================================================

  redis-dev:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - dokploy-network
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  dokploy-network:
    external: true

volumes:
  postgres_data:
    name: iris-dev-deploy-postgres-data
  redis_data:
    name: iris-dev-deploy-redis-data
