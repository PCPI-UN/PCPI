    command: prisma migrate deploy --schema=./apps/project-service/prisma/schema.prisma
    restart: "no"

  project-service-dev:
    build:
      context: .
      dockerfile: apps/project-service/Dockerfile
      target: production
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - DATABASE_URL=postgresql://project_user:${PROJECT_DB_PASSWORD}@postgres-dev:5433/project_service
      - EVENT_SERVICE_URL=${EVENT_SERVICE_URL:-event-service-dev:50053}
      - NOTIFICATION_SERVICE_URL=${NOTIFICATION_SERVICE_URL:-notification-service-dev:50056}
      - INVITATION_SERVICE_URL=${INVITATION_SERVICE_URL:-invitation-service-dev:50054}
      - GRPC_HOST=${GRPC_HOST:-0.0.0.0}
      - GRPC_PORT=${GRPC_PORT:-50055}
    depends_on:
      postgres-dev:
        condition: service_healthy
      project-migration-dev:
        condition: service_completed_successfully
    networks:
