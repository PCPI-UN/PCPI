      - NODE_ENV=production
    depends_on:
      postgres-dev:
        condition: service_healthy
    networks:
      - dokploy-network
    command: prisma migrate deploy --schema=./apps/invitation-service/prisma/schema.prisma
    restart: "no"

  invitation-service-dev:
    build:
      context: .
      dockerfile: apps/invitation-service/Dockerfile
      target: production
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - DATABASE_URL=postgresql://invitation_user:${INVITATION_DB_PASSWORD}@postgres-dev:5433/invitation_service
      - GRPC_HOST=${GRPC_HOST:-0.0.0.0}
      - GRPC_PORT=${GRPC_PORT:-50054}
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL:-auth-service-dev:50051}
      - EVENT_SERVICE_URL=${EVENT_SERVICE_URL:-event-service-dev:50053}
      - PROJECT_SERVICE_URL=${PROJECT_SERVICE_URL:-project-service-dev:50055}
      - NOTIFICATION_SERVICE_URL=${NOTIFICATION_SERVICE_URL:-notification-service-dev:50056}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
    depends_on:
      postgres-dev:
        condition: service_healthy
      invitation-migration-dev:
        condition: service_completed_successfully
    networks:
      - dokploy-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('net').createConnection({port:50054}).on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))\""]
