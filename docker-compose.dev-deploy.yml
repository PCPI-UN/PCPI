      timeout: 3s
      retries: 3
      start_period: 10s

  # ==================================================================
  # PROJECT SERVICE - Migration + Application
  # ==================================================================

  project-migration-dev:
    build:
      context: .
      dockerfile: apps/project-service/Dockerfile
      target: production
