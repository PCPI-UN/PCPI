    restart: always
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('net').createConnection({port:50053}).on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # ==================================================================
  # INVITATION SERVICE - Migration + Application
  # ==================================================================

  invitation-migration-dev:
