      - GRPC_HOST=${GRPC_HOST:-0.0.0.0}
      - GRPC_PORT=${GRPC_PORT:-50053}
    depends_on:
      postgres-dev:
        condition: service_healthy
      event-migration-dev:
        condition: service_completed_successfully
    networks:
