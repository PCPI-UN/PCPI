services:
  # PostgreSQL Databases
  auth-db:
    image: postgres:16-alpine
    container_name: pcpi-auth-db
    environment:
      POSTGRES_DB: auth_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - pcpi-network
    restart: unless-stopped

  evaluation-db:
    image: postgres:16-alpine
    container_name: pcpi-evaluation-db
    environment:
      POSTGRES_DB: evaluation_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - evaluation_db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - pcpi-network
    restart: unless-stopped

  event-db:
    image: postgres:16-alpine
    container_name: pcpi-event-db
    environment:
      POSTGRES_DB: event_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - event_db_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    networks:
      - pcpi-network
    restart: unless-stopped

  invitation-db:
    image: postgres:16-alpine
    container_name: pcpi-invitation-db
    environment:
      POSTGRES_DB: invitation_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - invitation_db_data:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    networks:
      - pcpi-network
    restart: unless-stopped

  project-db:
    image: postgres:16-alpine
    container_name: pcpi-project-db
    environment:
      POSTGRES_DB: project_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - project_db_data:/var/lib/postgresql/data
    ports:
      - "5436:5432"
    networks:
      - pcpi-network
    restart: unless-stopped

  # NestJS Services
  auth-service:
    build:
      context: .
      dockerfile: apps/auth-service/Dockerfile
      target: development
    container_name: pcpi-auth-service
    env_file:
      - ./apps/auth-service/.env
    ports:
      - "50051:50051"
    depends_on:
      - auth-db
    networks:
      - pcpi-network
    volumes:
      - ./apps:/app/apps
      - ./libs:/app/libs
      - ./package.json:/app/package.json
      - ./pnpm-lock.yaml:/app/pnpm-lock.yaml
      - ./tsconfig.json:/app/tsconfig.json
      - /app/node_modules
    command: sh -c "pnpm install --frozen-lockfile && pnpm exec prisma db push --schema=./apps/auth-service/prisma/schema.prisma --accept-data-loss && pnpm run start:dev auth-service"

  evaluation-service:
    build:
      context: .
      dockerfile: apps/evaluation-service/Dockerfile
      target: development
    container_name: pcpi-evaluation-service
    env_file:
      - ./apps/evaluation-service/.env
    ports:
      - "50052:50052"
    depends_on:
      - evaluation-db
    networks:
      - pcpi-network
    volumes:
      - ./apps:/app/apps
      - ./libs:/app/libs
      - ./package.json:/app/package.json
      - ./pnpm-lock.yaml:/app/pnpm-lock.yaml
      - ./tsconfig.json:/app/tsconfig.json
      - /app/node_modules
    command: sh -c "pnpm install --frozen-lockfile && pnpm exec prisma db push --schema=./apps/evaluation-service/prisma/schema.prisma --accept-data-loss && pnpm run start:dev evaluation-service"

  event-service:
    build:
      context: .
      dockerfile: apps/event-service/Dockerfile
      target: development
    container_name: pcpi-event-service
    env_file:
      - ./apps/event-service/.env
    ports:
      - "50053:50053"
    depends_on:
      - event-db
    networks:
      - pcpi-network
    volumes:
      - ./apps:/app/apps
      - ./libs:/app/libs
      - ./package.json:/app/package.json
      - ./pnpm-lock.yaml:/app/pnpm-lock.yaml
      - ./tsconfig.json:/app/tsconfig.json
      - /app/node_modules
    command: sh -c "pnpm install --frozen-lockfile && pnpm exec prisma db push --schema=./apps/event-service/prisma/schema.prisma --accept-data-loss && pnpm run start:dev event-service"

  invitation-service:
    build:
      context: .
      dockerfile: apps/invitation-service/Dockerfile
      target: development
    container_name: pcpi-invitation-service
    env_file:
      - ./apps/invitation-service/.env
    ports:
      - "50054:50054"
    depends_on:
      - invitation-db
    networks:
      - pcpi-network
    volumes:
      - ./apps:/app/apps
      - ./libs:/app/libs
      - ./package.json:/app/package.json
      - ./pnpm-lock.yaml:/app/pnpm-lock.yaml
      - ./tsconfig.json:/app/tsconfig.json
      - /app/node_modules
    command: sh -c "pnpm install --frozen-lockfile && pnpm exec prisma db push --schema=./apps/invitation-service/prisma/schema.prisma --accept-data-loss && pnpm run start:dev invitation-service"

  project-service:
    build:
      context: .
      dockerfile: apps/project-service/Dockerfile
      target: development
    container_name: pcpi-project-service
    env_file:
      - ./apps/project-service/.env
    ports:
      - "50055:50055"
    depends_on:
      - project-db
    networks:
      - pcpi-network
    volumes:
      - ./apps:/app/apps
      - ./libs:/app/libs
      - ./package.json:/app/package.json
      - ./pnpm-lock.yaml:/app/pnpm-lock.yaml
      - ./tsconfig.json:/app/tsconfig.json
      - /app/node_modules
    command: sh -c "pnpm install --frozen-lockfile && pnpm exec prisma db push --schema=./apps/project-service/prisma/schema.prisma --accept-data-loss && pnpm run start:dev project-service"

  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
      target: development
    container_name: pcpi-gateway
    env_file:
      - ./apps/gateway/.env
    
    ports:
      - "3000:3000"
    depends_on:
      - auth-service
      - evaluation-service
      - event-service
      - invitation-service
      - project-service
    networks:
      - pcpi-network
    volumes:
      - ./apps/gateway:/app/apps/gateway
      - ./libs:/app/libs
      - ./package.json:/app/package.json
      - ./pnpm-lock.yaml:/app/pnpm-lock.yaml
      - ./tsconfig.json:/app/tsconfig.json
      - /app/node_modules
    command: sh -c "pnpm install --frozen-lockfile && pnpm run start:dev gateway"

  notification-service:
    build:
      context: .
      dockerfile: ./apps/notification-service/Dockerfile
      target: development
    container_name: pcpi-notification-service
    command: pnpm run start:dev notification-service
    env_file:
      - ./apps/notification-service/.env
    networks:
      - pcpi-network
    ports:
      - '50056:50056'
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules

networks:
  pcpi-network:
    driver: bridge
    name: pcpi-network

volumes:
  auth_db_data:
    name: pcpi-auth-db-data
  evaluation_db_data:
    name: pcpi-evaluation-db-data
  event_db_data:
    name: pcpi-event-db-data
  invitation_db_data:
    name: pcpi-invitation-db-data
  project_db_data:
    name: pcpi-project-db-data
