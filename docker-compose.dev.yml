      - CI=true
    ports:
      - "50054:50054"
    volumes:
      - ./apps:/app/apps
      - ./libs:/app/libs
      - ./package.json:/app/package.json
      - ./pnpm-lock.yaml:/app/pnpm-lock.yaml
      - ./tsconfig.json:/app/tsconfig.json
      - ./nest-cli.json:/app/nest-cli.json
      - ./tsconfig.build.json:/app/tsconfig.build.json
      - /app/node_modules
    command: sh -c "pnpm install --frozen-lockfile --force && mkdir -p libs/common/src/generated && npm run proto:generate && pnpm exec prisma db push --schema=./apps/invitation-service/prisma/schema.prisma --accept-data-loss && pnpm run start:dev invitation-service"

  project-service:
