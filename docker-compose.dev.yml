services:
  # PostgreSQL Databases - expose ports for local dev access
  auth-db:
    ports:
      - "5432:5432"

  evaluation-db:
    ports:
      - "5433:5432"

  event-db:
    ports:
      - "5434:5432"

  invitation-db:
    ports:
      - "5435:5432"

  project-db:
    ports:
      - "5436:5432"

  # NestJS Services - Development mode with hot reload
  auth-service:
    build:
      target: development
    env_file:
      - ./apps/auth-service/.env
    environment:
      - CI=true
    ports:
      - "50051:50051"
    volumes:
      - ./apps:/app/apps
      - ./libs:/app/libs
      - ./package.json:/app/package.json
      - ./pnpm-lock.yaml:/app/pnpm-lock.yaml
      - ./tsconfig.json:/app/tsconfig.json
      - ./nest-cli.json:/app/nest-cli.json
      - ./tsconfig.build.json:/app/tsconfig.build.json
      - /app/node_modules
    command: sh -c "pnpm install --frozen-lockfile --force && mkdir -p libs/common/src/generated && npm run proto:generate && pnpm exec prisma generate --schema=./apps/auth-service/prisma/schema.prisma && pnpm exec prisma migrate deploy --schema=./apps/auth-service/prisma/schema.prisma && pnpm exec prisma db seed && pnpm run start:dev auth-service"

  evaluation-service:
    build:
      target: development
    env_file:
      - ./apps/evaluation-service/.env
    environment:
      - CI=true
    ports:
      - "50052:50052"
    volumes:
      - ./apps:/app/apps
      - ./libs:/app/libs
      - ./package.json:/app/package.json
      - ./pnpm-lock.yaml:/app/pnpm-lock.yaml
      - ./tsconfig.json:/app/tsconfig.json
      - ./nest-cli.json:/app/nest-cli.json
      - ./tsconfig.build.json:/app/tsconfig.build.json
      - /app/node_modules
    command: sh -c "pnpm install --frozen-lockfile --force && mkdir -p libs/common/src/generated && npm run proto:generate && pnpm exec prisma db push --schema=./apps/evaluation-service/prisma/schema.prisma --accept-data-loss && pnpm run start:dev evaluation-service"

  event-service:
    build:
      target: development
    env_file:
      - ./apps/event-service/.env
    environment:
      - CI=true
    ports:
      - "50053:50053"
    volumes:
      - ./apps:/app/apps
      - ./libs:/app/libs
      - ./package.json:/app/package.json
      - ./pnpm-lock.yaml:/app/pnpm-lock.yaml
      - ./tsconfig.json:/app/tsconfig.json
      - ./nest-cli.json:/app/nest-cli.json
      - ./tsconfig.build.json:/app/tsconfig.build.json
      - /app/node_modules
    command: sh -c "pnpm install --frozen-lockfile --force && mkdir -p libs/common/src/generated && npm run proto:generate && pnpm exec prisma db push --schema=./apps/event-service/prisma/schema.prisma --accept-data-loss && pnpm run start:dev event-service"

  invitation-service:
