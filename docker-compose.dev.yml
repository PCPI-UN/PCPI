    ports:
      - "50055:50055"
    volumes:
      - ./apps:/app/apps
      - ./libs:/app/libs
      - ./package.json:/app/package.json
      - ./pnpm-lock.yaml:/app/pnpm-lock.yaml
      - ./tsconfig.json:/app/tsconfig.json
      - ./nest-cli.json:/app/nest-cli.json
      - ./tsconfig.build.json:/app/tsconfig.build.json
      - /app/node_modules
    command: sh -c "pnpm install --frozen-lockfile --force && mkdir -p libs/common/src/generated && npm run proto:generate && pnpm exec prisma db push --schema=./apps/project-service/prisma/schema.prisma --accept-data-loss && pnpm run start:dev project-service"

  gateway:
    build:
      target: development
    env_file:
      - ./apps/gateway/.env
    environment:
      - CI=true
    ports:
      - "80:3000"
    volumes:
      - ./apps:/app/apps
      - ./libs:/app/libs
      - ./package.json:/app/package.json
      - ./pnpm-lock.yaml:/app/pnpm-lock.yaml
      - ./tsconfig.json:/app/tsconfig.json
      - ./nest-cli.json:/app/nest-cli.json
