services:
  # PostgreSQL Databases
  auth-db:
    image: postgres:16-alpine
    container_name: pcpi-auth-db
    environment:
      POSTGRES_DB: auth_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-postgres}
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    networks:
      - pcpi-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auth_service"]
      interval: 5s
      timeout: 3s
      retries: 10

  evaluation-db:
    image: postgres:16-alpine
    container_name: pcpi-evaluation-db
    environment:
      POSTGRES_DB: evaluation_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${EVALUATION_DB_PASSWORD:-postgres}
    volumes:
      - evaluation_db_data:/var/lib/postgresql/data
    networks:
      - pcpi-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d evaluation_service"]
      interval: 5s
      timeout: 3s
      retries: 10

  event-db:
    image: postgres:16-alpine
    container_name: pcpi-event-db
    environment:
      POSTGRES_DB: event_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${EVENT_DB_PASSWORD:-postgres}
    volumes:
      - event_db_data:/var/lib/postgresql/data
    networks:
      - pcpi-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d event_service"]
      interval: 5s
      timeout: 3s
      retries: 10

  invitation-db:
    image: postgres:16-alpine
    container_name: pcpi-invitation-db
    environment:
      POSTGRES_DB: invitation_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${INVITATION_DB_PASSWORD:-postgres}
    volumes:
      - invitation_db_data:/var/lib/postgresql/data
    networks:
      - pcpi-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d invitation_service"]
      interval: 5s
      timeout: 3s
      retries: 10

  project-db:
    image: postgres:16-alpine
    container_name: pcpi-project-db
    environment:
      POSTGRES_DB: project_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PROJECT_DB_PASSWORD:-postgres}
    volumes:
      - project_db_data:/var/lib/postgresql/data
    networks:
      - pcpi-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d project_service"]
      interval: 5s
      timeout: 3s
      retries: 10

  # NestJS Services
  auth-service:
    build:
      context: .
      dockerfile: apps/auth-service/Dockerfile
    container_name: pcpi-auth-service
    depends_on:
      auth-db:
        condition: service_healthy
    networks:
      - pcpi-network

  evaluation-service:
    build:
      context: .
      dockerfile: apps/evaluation-service/Dockerfile
    container_name: pcpi-evaluation-service
    depends_on:
      evaluation-db:
        condition: service_healthy
    networks:
      - pcpi-network

  event-service:
    build:
      context: .
      dockerfile: apps/event-service/Dockerfile
    container_name: pcpi-event-service
    depends_on:
      event-db:
        condition: service_healthy
    networks:
      - pcpi-network

  invitation-service:
    build:
      context: .
      dockerfile: apps/invitation-service/Dockerfile
    container_name: pcpi-invitation-service
    depends_on:
      invitation-db:
        condition: service_healthy
    networks:
      - pcpi-network

  project-service:
    build:
      context: .
      dockerfile: apps/project-service/Dockerfile
    container_name: pcpi-project-service
    depends_on:
      project-db:
        condition: service_healthy
    networks:
      - pcpi-network

  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    container_name: pcpi-gateway
    depends_on:
      - auth-service
      - evaluation-service
      - event-service
      - invitation-service
      - project-service
      - notification-service
    networks:
      - pcpi-network

  notification-service:
    build:
      context: .
      dockerfile: ./apps/notification-service/Dockerfile
    container_name: pcpi-notification-service
    networks:
      - pcpi-network

networks:
  pcpi-network:
    driver: bridge
    name: pcpi-network

volumes:
  auth_db_data:
    name: pcpi-auth-db-data
  evaluation_db_data:
    name: pcpi-evaluation-db-data
  event_db_data:
    name: pcpi-event-db-data
  invitation_db_data:
    name: pcpi-invitation-db-data
  project_db_data:
    name: pcpi-project-db-data
