services:
  # PostgreSQL Database - Single instance with multiple databases
  postgres:
    image: postgres:16-alpine
    container_name: iris-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
      # Pass individual database passwords to init script
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-postgres}
      EVALUATION_DB_PASSWORD: ${EVALUATION_DB_PASSWORD:-postgres}
      EVENT_DB_PASSWORD: ${EVENT_DB_PASSWORD:-postgres}
      INVITATION_DB_PASSWORD: ${INVITATION_DB_PASSWORD:-postgres}
      PROJECT_DB_PASSWORD: ${PROJECT_DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    networks:
      - iris-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  # NestJS Services
  auth-service:
    build:
      context: .
      dockerfile: apps/auth-service/Dockerfile
    container_name: iris-auth-service
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - iris-network

  evaluation-service:
    build:
      context: .
      dockerfile: apps/evaluation-service/Dockerfile
    container_name: iris-evaluation-service
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - iris-network

  event-service:
    build:
      context: .
      dockerfile: apps/event-service/Dockerfile
    container_name: iris-event-service
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - iris-network

  invitation-service:
    build:
      context: .
      dockerfile: apps/invitation-service/Dockerfile
    container_name: iris-invitation-service
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - iris-network

  project-service:
    build:
      context: .
      dockerfile: apps/project-service/Dockerfile
    container_name: iris-project-service
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - iris-network

  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    container_name: iris-gateway
    depends_on:
      - auth-service
      - evaluation-service
      - event-service
      - invitation-service
      - project-service
      - notification-service
    networks:
      - iris-network

  notification-service:
    build:
      context: .
      dockerfile: ./apps/notification-service/Dockerfile
    container_name: iris-notification-service
    networks:
      - iris-network

  redis:
    image: redis:7-alpine
    container_name: iris-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_dev_password}
    volumes:
      - redis_data:/data
    networks:
      - iris-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  iris-network:
    driver: bridge
    name: iris-network

volumes:
  postgres_data:
    name: iris-postgres-data
  redis_data:
    name: iris-redis-data
