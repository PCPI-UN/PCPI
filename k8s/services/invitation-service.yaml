apiVersion: v1
kind: Service
metadata:
  name: invitation-service
  namespace: pcpi
spec:
  selector:
    app: invitation-service
  ports:
    - port: 50054
      targetPort: 50054
      protocol: TCP
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: invitation-service
  namespace: pcpi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: invitation-service
  template:
    metadata:
      labels:
        app: invitation-service
    spec:
      containers:
        - name: invitation-service
          image: pcpi/invitation-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 50054
          env:
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: pcpi-config
                  key: INVITATION_DATABASE_URL
            - name: GRPC_HOST
              valueFrom:
                configMapKeyRef:
                  name: pcpi-config
                  key: INVITATION_GRPC_HOST
            - name: GRPC_PORT
              valueFrom:
                configMapKeyRef:
                  name: pcpi-config
                  key: INVITATION_GRPC_PORT
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: pcpi-config
                  key: NODE_ENV
          readinessProbe:
            tcpSocket:
              port: 50054
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 50054
            initialDelaySeconds: 15
            periodSeconds: 10
