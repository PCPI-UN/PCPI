name: Docker Image CI

on:
  push:
    branches: [ "refactor/CU-86e0d71ar/Dev-Tooling-Investigate-and-document-Dockerfile-optimization-opportunities" ]
  pull_request:
    branches: [ "prod" , "dev" ]
  workflow_dispatch:

jobs:
  migrations-service-build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        services: [auth-service,evaluation-service,event-service,invitation-service,project-service,notification-service,gateway]
        
    steps:

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Checkout code
      uses: actions/checkout@v3
        
    - name: Creation of the SHA tag 
      uses: docker/metadata-action@v5
      id: sha-tag
      with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPOSITORY }}
          tags: type=sha,prefix=sha-,suffix=-${{ matrix.services }}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
        
    - name: Build and push base image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./apps/${{ matrix.services }}/Dockerfile 
        tags: ${{ steps.sha-tag.outputs.tags }}
        platforms: linux/arm64
        push: true
        no-cache: true
        

    
    
    
    
