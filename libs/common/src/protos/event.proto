syntax = "proto3";

package event;

// =====================
//      SERVICES
// =====================
service EventService {
  // ---- EVENTS ----
  rpc CreateEvent (CreateEventRequest) returns (CreateEventResponse) {}
  rpc UpdateEvent (UpdateEventRequest) returns (UpdateEventResponse) {}
  rpc GetEvent (GetEventRequest) returns (GetEventResponse) {}
  rpc DeleteEvent (DeleteEventRequest) returns (DeleteEventResponse) {}
  rpc ListEventsPage (ListEventsRequestPage) returns (ListEventsResponsePage) {}

  // ---- EVENT MEMBERS ----
  rpc CreateEventMember (CreateEventMemberRequest) returns (CreateEventMemberResponse) {}
  rpc DeleteEventMember (DeleteEventMemberRequest) returns (DeleteEventMemberResponse) {}
  rpc GetEventMember (GetEventMemberRequest) returns (GetEventMemberResponse) {}
  rpc ListEventMembers (ListEventMembersRequest) returns (ListEventMembersResponse) {}

  // ---- COURSES ----
  rpc CreateCourse (CreateCourseRequest) returns (CreateCourseResponse) {}
  rpc UpdateCourse (UpdateCourseRequest) returns (UpdateCourseResponse) {}
  rpc GetCourse (GetCourseRequest) returns (GetCourseResponse) {}
  rpc ListCourses (ListCoursesRequest) returns (ListCoursesResponse) {}
  rpc DeleteCourse (DeleteCourseRequest) returns (DeleteCourseResponse) {}
  rpc ListCoursesByEvent (ListCoursesByEventRequest) returns (ListCoursesResponse);
}

// =====================
//        MODELS
// =====================
message Course {
  int32 id = 1;
  int32 eventId = 2;      // relación 1:N (un evento tiene muchos cursos)
  string code = 3;        // ej: "SYSENG", "MECHENG", "INDENG"
  string description = 4; // opcional
  bool active = 5;
  string createdAt = 6;
  string updatedAt = 7;
}

// =====================
//      EVENTS MODULE
// =====================

message CreateEventRequest {
  int32 organizationId = 1;
  string name = 2;
  string accessCode = 3;
  bool isPubliclyJoinable = 4;
  string inscriptionDeadline = 5;
  bool evaluationsOpened = 6;
  string startDate = 7;
  string endDate = 8;
  string description = 9;
  string location = 10;
} 


message CreateEventResponse {
  bool ok = 1;
  string message = 2;
}

message UpdateEventRequest {
  int32 id = 1;
  string name = 2;
  string description = 3;
  string accessCode = 4;
  bool isPubliclyJoinable = 5;
  string inscriptionDeadline = 6;
  bool evaluationsOpened = 7;
  string startDate = 8;
  string endDate = 9;
  bool active = 10;
    string location = 11;

}

message UpdateEventResponse {
  bool ok = 1;
  string message = 2;
}

message GetEventRequest {
  int32 id = 1;
}

message GetEventResponse {
  int32 id = 1;
  string name = 2;
  string description = 3;
  string accessCode = 4;
  bool isPubliclyJoinable = 5;
  string inscriptionDeadline = 6;
  bool evaluationsOpened = 7;
  string startDate = 8;
  string endDate = 9;
  bool active = 10;
  string createdAt = 11;
  string updatedAt = 12;
  string location = 13;
  EventStatus status = 17;



  
}



message DeleteEventRequest {
  int32 id = 1;
}

message DeleteEventResponse {
  bool ok = 1;
}

message ListEventsRequestPage {
  int32 page = 1;            // default 1
  int32 limit = 2;           // default 10, máx 100
  string q = 3;              // búsqueda por name/description
  bool onlyActive = 4;       // filtra activos=true
}

message ListEventsResponsePage {
  repeated GetEventResponse items = 1;
  int32 page = 2;
  int32 limit = 3;
  int32 total = 4;
  int32 totalPages = 5;
  bool hasNext = 6;
  bool hasPrev = 7;
}

// =====================
//  EVENT MEMBERS MODULE
// =====================

message CreateEventMemberRequest {
  int32 eventId = 1;
  int32 userId = 2;
  int32 roleId = 3;
}

message CreateEventMemberResponse {
  bool ok = 1;
  string message = 2;
}

message DeleteEventMemberRequest {
  int32 eventId = 1;
  int32 userId = 2;
}

message DeleteEventMemberResponse {
  bool ok = 1;
}

message GetEventMemberRequest {
  int32 eventId = 1;
  int32 userId = 2;
}

message GetEventMemberResponse {
  int32 userId = 1;
  int32 eventId = 2;
  int32 roleId = 3;
  bool active = 4;
  string createdAt = 5;
  string updatedAt = 6;
}

message ListEventMembersRequest {
  int32 eventId = 1;
  optional int32 roleId = 2;
  optional int32 page = 3;
}

message EventMemberProto {
  int32 userId = 1;
  int32 eventId = 2;
  int32 roleId = 3;
  bool active = 4;
  string createdAt = 5;
  string updatedAt = 6;
}

message ListEventMembersResponse {
  repeated EventMemberProto members = 1;
  int32 total = 2;
  int32 page = 3;
  int32 total_pages = 4;
}

// =====================
//     COURSES MODULE
// =====================

message CreateCourseRequest {
  int32 eventId = 1;       // obligatorio (a qué evento pertenece)
  string code = 2;         // único dentro del evento
  string description = 3;  // opcional
  bool active = 4;
}

message CreateCourseResponse {
  bool ok = 1;
  string message = 2;
}

message UpdateCourseRequest {
  int32 id = 1;
  string code = 2;
  string description = 3;
  bool active = 4;
}

message UpdateCourseResponse {
  bool ok = 1;
  string message = 2;
}

message GetCourseRequest {
  int32 id = 1;
}

message GetCourseResponse {
  Course course = 1;
}

message ListCoursesRequest {
  int32 eventId = 1; // opcional para filtrar cursos por evento
  int32 pageSize = 2;
  string pageToken = 3;
  bool onlyActive = 4;
}

message ListCoursesResponse {
  repeated Course courses = 1;
  string nextPageToken = 2;
}

message DeleteCourseRequest {
  int32 id = 1;
}

message DeleteCourseResponse {
  bool ok = 1;
}
message ListCoursesByEventRequest {
  int32 eventId = 1;      // ← requerido
  bool onlyActive = 2;    // opcional
  int32 page = 3;         // opcional (default 1)
  int32 pageSize = 4;     // opcional (default 20)
  string q = 5;           // opcional (code/description)
}
message ListCoursesByEventResponse {
  repeated Course courses = 1;
  string nextPageToken = 2; // deja vacío por ahora
}

enum EventStatus {
  EVENT_STATUS_UNSPECIFIED = 0;
  EVENT_STATUS_UPCOMING   = 1;  // PROXIMAMENTE
  EVENT_STATUS_AVAILABLE  = 2;  // DISPONIBLE
  EVENT_STATUS_CLOSED     = 3;  // CERRADO
}

message Empty {}
