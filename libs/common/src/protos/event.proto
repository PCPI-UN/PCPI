syntax = "proto3";

package event;

// =====================
//      SERVICES
// =====================
service EventService {
  // ---- EVENTS ----
  rpc CreateEvent (CreateEventRequest) returns (CreateEventResponse) {}
  rpc UpdateEvent (UpdateEventRequest) returns (UpdateEventResponse) {}
  rpc GetEvent (GetEventRequest) returns (GetEventResponse) {}
  rpc DeleteEvent (DeleteEventRequest) returns (DeleteEventResponse) {}
  rpc ListMyEvents (ListMyEventsRequest) returns (ListMyEventsResponse) {}
  // Public endpoint for listing all events - used for public event browsing and admin event management
  rpc ListEvents (ListEventsRequest) returns (ListEventsResponse) {}
  // Get event status mappings for gateway caching
  rpc GetEventStatuses (GetEventStatusesRequest) returns (GetEventStatusesResponse) {}

  // ---- EVENT MEMBERS ----
  rpc CreateEventMember (CreateEventMemberRequest) returns (CreateEventMemberResponse) {}
  rpc DeleteEventMember (DeleteEventMemberRequest) returns (DeleteEventMemberResponse) {}
  rpc GetEventMember (GetEventMemberRequest) returns (GetEventMemberResponse) {}
  rpc ListEventMembers (ListEventMembersRequest) returns (ListEventMembersResponse) {}

  // ---- COURSES ----
  rpc CreateCourse (CreateCourseRequest) returns (CreateCourseResponse) {}
  rpc UpdateCourse (UpdateCourseRequest) returns (UpdateCourseResponse) {}
  rpc GetCourse (GetCourseRequest) returns (GetCourseResponse) {}
  rpc ListCourses (ListCoursesRequest) returns (ListCoursesResponse) {}
  rpc DeleteCourse (DeleteCourseRequest) returns (DeleteCourseResponse) {}
  rpc ListCoursesByEvent (ListCoursesByEventRequest) returns (ListCoursesResponse);
  rpc ListCoursesForDropdown (ListCoursesForDropdownRequest) returns (ListCoursesForDropdownResponse) {}
}

// =====================
//        MODELS
// =====================
message Course {
  int32 id = 1;
  int32 eventId = 2;      // relación 1:N (un evento tiene muchos cursos)
  string code = 3;        // ej: "SYSENG", "MECHENG", "INDENG"
  string description = 4; // opcional
  bool active = 5;
  string createdAt = 6;
  string updatedAt = 7;
}

// =====================
//      EVENTS MODULE
// =====================

// Event Proto - standard event representation
message EventProto {
  int32 id = 1;
  string name = 2;
  string description = 3;
  string accessCode = 4;
  bool isPubliclyJoinable = 5;
  string inscriptionDeadline = 6;
  bool evaluationsOpened = 7;
  string startDate = 8;
  string endDate = 9;
  bool active = 10;
  string createdAt = 11;
  string updatedAt = 12;
  string location = 13;
  EventStatus status = 14;
}

message CreateEventRequest {
  string name = 1;
  string accessCode = 2;
  bool isPubliclyJoinable = 3;
  string inscriptionDeadline = 4;
  bool evaluationsOpened = 5;
  string startDate = 6;
  string endDate = 7;
  string description = 8;
  string location = 9;
  optional int32 createdByUserId = 10;
}

message CreateEventResponse {
  EventProto event = 1;
}

message UpdateEventRequest {
  int32 id = 1;
  string name = 2;
  string description = 3;
  string accessCode = 4;
  bool isPubliclyJoinable = 5;
  string inscriptionDeadline = 6;
  bool evaluationsOpened = 7;
  string startDate = 8;
  string endDate = 9;
  bool active = 10;
  string location = 11;
}

message UpdateEventResponse {
  EventProto event = 1;
}

message GetEventRequest {
  int32 id = 1;
}

message GetEventResponse {
  EventProto event = 1;
}



message DeleteEventRequest {
  int32 id = 1;
}

message DeleteEventResponse {
  bool ok = 1;
}

// New ListMyEvents messages
message ListMyEventsRequest {
  int32 userId = 1;
  optional int32 page = 2;    // default: 1
  optional int32 limit = 3;   // default: 10, max: 50
}

message EventWithRole {
  int32 id = 1;
  string name = 2;
  string description = 3;
  string accessCode = 4;
  bool isPubliclyJoinable = 5;
  string inscriptionDeadline = 6;
  bool evaluationsOpened = 7;
  string startDate = 8;
  string endDate = 9;
  bool active = 10;
  string createdAt = 11;
  string updatedAt = 12;
  string location = 13;
  EventStatus status = 14;
  int32 roleId = 15;  // Role ID only - gateway will enrich with role details
}

message EventRole {
  int32 id = 1;
  string name = 2;
  string scope = 3;        // "PLATFORM" or "EVENT"
  string description = 4;
}

message PaginationMetadata {
  int32 total = 1;
  int32 itemsOnCurrentPage = 2;
  int32 itemsPerPage = 3;
  int32 currentPage = 4;
  int32 totalPages = 5;
}

message ListMyEventsResponse {
  repeated EventWithRole events = 1;
  PaginationMetadata meta = 2;
}

// Public listing of events - for browsing and admin management
message ListEventsRequest {
  optional int32 page = 1;       // default: 1
  optional int32 limit = 2;      // default: 10
  optional string q = 3;         // search query (name/description)
  optional bool onlyActive = 4;  // default: true
  optional EventStatus status = 5;  // filter by status (UPCOMING, AVAILABLE, CLOSED)
}

message ListEventsResponse {
  repeated EventProto events = 1;
  PaginationMetadata meta = 2;
}

// Get Event Statuses - for gateway caching
message GetEventStatusesRequest {}

message EventStatusMapping {
  int32 value = 1;       // Numeric enum value (0, 1, 2, 3, 4)
  string name = 2;       // String name (UNSPECIFIED, UPCOMING, REGISTRATION_CLOSED, AVAILABLE, CLOSED)
  string description = 3; // Human-readable description
}

message GetEventStatusesResponse {
  repeated EventStatusMapping statuses = 1;
}

// =====================
//  EVENT MEMBERS MODULE
// =====================

message CreateEventMemberRequest {
  int32 eventId = 1;
  int32 userId = 2;
  int32 roleId = 3;
}

message CreateEventMemberResponse {
  bool ok = 1;
  string message = 2;
}

message DeleteEventMemberRequest {
  int32 eventId = 1;
  int32 userId = 2;
}

message DeleteEventMemberResponse {
  bool ok = 1;
}

message GetEventMemberRequest {
  int32 eventId = 1;
  int32 userId = 2;
}

message GetEventMemberResponse {
  int32 userId = 1;
  int32 eventId = 2;
  int32 roleId = 3;
  bool active = 4;
  string createdAt = 5;
  string updatedAt = 6;
}

message ListEventMembersRequest {
  int32 eventId = 1;
  optional int32 roleId = 2;
  optional int32 page = 3;
  optional int32 limit = 4;
}

message EventMemberProto {
  int32 userId = 1;
  int32 eventId = 2;
  int32 roleId = 3;
  bool active = 4;
  string createdAt = 5;
  string updatedAt = 6;
}

message ListEventMembersResponse {
  repeated EventMemberProto members = 1;
  PaginationMetadata meta = 2;
}

// =====================
//     COURSES MODULE
// =====================

message CreateCourseRequest {
  int32 eventId = 1;       // obligatorio (a qué evento pertenece)
  string code = 2;         // único dentro del evento
  string description = 3;  // opcional
  bool active = 4;
}

message CreateCourseResponse {
  bool ok = 1;
  string message = 2;
}

message UpdateCourseRequest {
  int32 id = 1;
  string code = 2;
  string description = 3;
  bool active = 4;
}

message UpdateCourseResponse {
  bool ok = 1;
  string message = 2;
}

message GetCourseRequest {
  int32 id = 1;
}

message GetCourseResponse {
  Course course = 1;
}

message ListCoursesRequest {
  optional int32 eventId = 1; // optional filter by event
  optional bool onlyActive = 2;
  optional int32 page = 3;
  optional int32 limit = 4;
  optional string q = 5; // search by code/description
}

message ListCoursesResponse {
  repeated Course courses = 1;
  PaginationMetadata meta = 2;
}

message DeleteCourseRequest {
  int32 id = 1;
}

message DeleteCourseResponse {
  bool ok = 1;
}
message ListCoursesByEventRequest {
  int32 eventId = 1;      // required
  optional bool onlyActive = 2;
  optional int32 page = 3;
  optional int32 limit = 4;
  optional string q = 5; // search by code/description
}

message CourseDropdown {
  int32 id = 1;
  string code = 2;
  string description = 3;
}

message ListCoursesForDropdownRequest {
  int32 eventId = 1;      // required
  optional bool onlyActive = 2; // default: true
}

message ListCoursesForDropdownResponse {
  repeated CourseDropdown courses = 1;
}

enum EventStatus {
  UNSPECIFIED = 0;
  UPCOMING   = 1;  // Event hasn't started, registrations still open
  REGISTRATION_CLOSED = 2;  // Registrations closed, event hasn't started yet
  AVAILABLE  = 3;  // Event is currently happening
  CLOSED     = 4;  // Event has ended
}

message Empty {}
