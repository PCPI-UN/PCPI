syntax = "proto3";

package evaluation;

// ===== EVALUATION SERVICE =====
service EvaluationService {
  rpc EvaluateProject(EvaluateProjectRequest) returns (EvaluationProto);
  rpc FindEvaluationById(FindEvaluationByIdRequest) returns (EvaluationProto);
  rpc FindEvaluationsByEvaluator(FindEvaluationsByEvaluatorRequest) returns (FindEvaluationsByEvaluatorResponse);
  rpc GetProjectStats(GetProjectStatsRequest) returns (GetProjectStatsResponse);
  rpc CheckEvaluationStatus(CheckEvaluationStatusRequest) returns (CheckEvaluationStatusResponse);
}

// ===== CRITERIONS SERVICE =====
service CriterionsService {
  // Creates a new criterion
  rpc CreateCriterion (CreateCriterionRequest) returns (CriterionProto) {}

  // Updates an existing criterion
  rpc UpdateCriterion (UpdateCriterionRequest) returns (CriterionProto) {}

  // Gets a criterion by ID
  rpc GetCriterion (GetCriterionRequest) returns (CriterionProto) {}

  // Lists criterions with optional filters
  rpc ListCriterions (ListCriterionsRequest) returns (ListCriterionsResponse) {}

  // Lists criterions by course
  rpc FindCriterionsByCourse(FindCriterionsByCourseRequest) returns (FindCriterionsByCourseResponse) {}

  // Deletes a criterion
  rpc DeleteCriterion (DeleteCriterionRequest) returns (DeleteCriterionResponse) {}
}

// ===== COMMON MESSAGES =====

message PaginationMetadata {
  int32 total = 1;
  int32 itemsOnCurrentPage = 2;
  int32 itemsPerPage = 3;
  int32 currentPage = 4;
  int32 totalPages = 5;
}

// Criterion response type
message CriterionProto {
  int32 id = 1;
  int32 eventId = 2;
  string name = 3;
  optional string description = 4;
  double weight = 5;
  bool active = 6;
  repeated int32 courseIds = 7;
  optional string category = 8;
}

message EvaluationProto {
  int32 id = 1;
  int32 projectId = 2;
  int32 userId = 3;
  int32 eventId = 4;
  double grade = 6;
  optional string comments = 7;
  string date = 8;
  repeated EvaluationDetailResponse scores = 9;
}

// ===== EVALUATION MESSAGES =====

message EvaluationScore {
  int32 criterionId = 1;
  int32 score = 2;
}

message EvaluateProjectRequest {
  int32 projectId = 1;
  int32 userId = 2;
  optional string comments = 3;
  repeated EvaluationScore scores = 4;
}

message FindEvaluationByIdRequest {
  int32 id = 1;
}

message FindEvaluationsByEvaluatorRequest {
  int32 userId = 1;
  int32 eventId = 2;
  optional int32 page = 3;
  optional int32 limit = 4;
}

message FindEvaluationsByEvaluatorResponse {
  repeated EvaluationProto evaluations = 1;
  PaginationMetadata meta = 2;
}

message GetProjectStatsRequest {
  int32 projectId = 1;
}

message CategoryStatsResponse {
  string category = 1;
  double averageScore = 2;
  double weight = 3;
}

message GetProjectStatsResponse {
  int32 projectId = 1;
  double averageGrade = 2;
  int32 evaluationCount = 3;
  repeated CategoryStatsResponse categoryStats = 4;
}

message CheckEvaluationStatusRequest {
  int32 userId = 1;
  int32 eventId = 2;
  repeated int32 projectIds = 3;
}

message ProjectEvaluationStatus {
  int32 projectId = 1;
  bool evaluated = 2;
  optional EvaluationProto evaluation = 3;
}

message CheckEvaluationStatusResponse {
  repeated ProjectEvaluationStatus projects = 1;
}

message EvaluationDetailResponse {
  int32 evaluationId = 1;
  int32 criterionId = 2;
  double score = 3;
}

// ===== CRITERIONS MESSAGES =====


// The request message for getting criterions of a course
message FindCriterionsByCourseRequest {
  int32 courseId = 1;
}

// Simplified criterion info for category grouping
message CriterionSummary {
  int32 id = 1;
  string name = 2;
}

message CriterionCategoryProto {
  string category = 1;
  double weight = 2;
  repeated CriterionSummary criterions = 3;
}

// The response message for getting criterions of a course
message FindCriterionsByCourseResponse {
  repeated CriterionCategoryProto categories = 1; 
}

// The request message for creating a new criterion.
message CreateCriterionRequest {
  int32 eventId = 1;
  string name = 2;
  optional string description = 3;
  double weight = 4;
  repeated int32 courseIds = 5;
  optional string category = 6;
}

// The request message for updating a criterion.
message UpdateCriterionRequest {
  int32 id = 1;
  optional int32 eventId = 2;
  optional string name = 3;
  optional string description = 4;
  optional double weight = 5;
  optional bool active = 6;
  repeated int32 courseIds = 7;
  optional string category = 8;
}

// The request message for getting a criterion by ID.
message GetCriterionRequest {
  int32 id = 1;
}

// The request message for listing criterions.
message ListCriterionsRequest {
  optional int32 eventId = 1;    
  optional int32 courseId = 2;   
  optional int32 limit = 3;
  optional int32 page = 4;
}

// The response message containing the list of criterions.
message ListCriterionsResponse {
  repeated CriterionProto criterions = 1;
  PaginationMetadata meta = 2;
}

// The request message for deleting a criterion.
message DeleteCriterionRequest {
  int32 id = 1;
}

// The response message for deleting a criterion.
message DeleteCriterionResponse {
  bool success = 1;
  string message = 2;
}

