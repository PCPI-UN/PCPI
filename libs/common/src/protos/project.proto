syntax = "proto3";

package project;

service ProjectsService {
  rpc CreateProject (CreateProjectRequest)   returns (ProjectResponse);
  rpc GetProject    (GetProjectRequest)      returns (ProjectResponse);
  rpc GetProjectComplete    (GetProjectRequest)      returns (ProjectCompleteResponse);
  rpc ListProjectsByEvent (ListProjectsByEventRequest) returns (ListProjectsResponse);

  rpc CreateProjectWithPendingParticipants(CreateProjectWithParticipantsRequest)
      returns (CreateProjectWithParticipantsResponse);

  // Documentos: gRPC no es ideal para binarios grandes → patrón de URL firmada
  // rpc IssueUploadUrl (IssueUploadUrlRequest) returns (IssueUploadUrlResponse);
  rpc AddProjectDocumentFromUrl (AddProjectDocumentFromUrlRequest) returns (ProjectDocumentResponse);
  rpc ListProjectDocuments (ListProjectDocumentsRequest) returns (ListProjectDocumentsResponse);
  rpc UpdateProjectDocument (UpdateProjectDocumentRequest) returns (ProjectDocumentResponse);

  // Participantes
  rpc AddParticipant (AddParticipantRequest) returns (AddParticipantResponse);
  rpc ListParticipants (ListParticipantsRequest) returns (ListParticipantsResponse);
  rpc AddPendingParticipant (AddPendingParticipantRequest) returns (AddPendingParticipantResponse);
  rpc ListPendingParticipants (ListPendingParticipantsRequest) returns (ListPendingParticipantsResponse);

  rpc UpdateProject (UpdateProjectRequest) returns (ProjectResponse);      
  rpc ApproveProject (ApproveProjectRequest) returns (ProjectResponse);
  rpc RejectProject (RejectProjectRequest) returns (ProjectResponse);     
  rpc AssignJurorToProjects (AssignJurorToProjectsRequest) returns (AssignJurorToProjectsResponse); 
  rpc ReassignProjectJuror (ReassignProjectJurorRequest) returns (ReassignProjectJurorResponse);  
  rpc ListProjectJurors (ListProjectJurorsRequest) returns (ListProjectJurorsResponse);  
  rpc ListAssignedProjects(ListAssignedProjectsRequest) returns (ListAssignedProjectsResponse);
  rpc GetMyProjectByEvent (GetMyProjectByEventRequest) returns (GetMyProjectByEventResponse);

  rpc ListProjectsForReview(ListProjectsForReviewRequest) returns (ListProjectsForReviewResponse);
  rpc DeleteProject (DeleteProjectRequest) returns (DeleteProjectResponse);
  
}

enum ProjectState {
  PROJECT_STATE_UNSPECIFIED = 0;
  UNDER_REVIEW = 1;
  APPROVED = 2;
  REJECTED = 3;
}

enum TypedDocument {
  DOC_UNSPECIFIED = 0;
  LOGO = 1;
  POSTER = 2;
  SUPPORTING_DOCUMENT = 3;
}

enum DocumentStatus {
  DOCUMENT_STATUS_UNSPECIFIED = 0;
  ACTIVE = 1;
  INACTIVE = 2;
}

/************** Messages **************/
message JurorKey {
  int32 memberUserId = 1;
  int32 memberEventId = 2;
  int32 memberRoleId = 3;
}

message Project {
  int32 id = 1;
  int32 eventId = 2;
  string name = 3;
  optional string description = 4;
  optional string eventNumber = 5;
  string createdAt = 6; 
  string updatedAt = 7; 
  int32 courseId = 8;
  ProjectState state = 9;
  optional string rejectionReason = 10;
}

message ProjectComplete {
  int32 id = 1;
  int32 eventId = 2;
  string name = 3;
  optional string description = 4;
  optional string eventNumber = 5;
  string createdAt = 6; 
  string updatedAt = 7; 
  int32 courseId = 8;
  ProjectState state = 9;
  optional string rejectionReason = 10;
  repeated ProjectParticipant participants = 11;
  repeated ProjectDocument documents = 12;
  repeated PendingProjectParticipant pendingParticipants = 13;
}

message ProjectDocument {
  int32 id = 1;
  int32 projectId = 2;
  string url = 3;
  TypedDocument type = 4;
  string createdAt = 5;
  string updatedAt = 6;
  DocumentStatus state = 7;
}

message ProjectParticipant {
  int32 userId = 1;
  int32 projectId = 2;
  string studentCode = 3; 
  optional string firstName = 4;
  optional string lastName = 5;
  optional string email = 6;
}

message PendingProjectParticipant {
  int32 pendingId = 1;
  int32 projectId = 2;
  string firstName = 3;
  string lastName = 4;
  string email = 5;
  string studentCode = 6;
  string status = 7;
  string invitedAt = 8;
  string joinedAt = 9;
  string createdAt = 10;
  string updatedAt = 11;
}

message PendingParticipantInput {
  string firstName = 1;
  optional string lastName = 2;
  string email = 3;
  string studentCode = 4;
  optional string status = 5; // PENDING (default), INVITED, JOINED - optional for public registration
}

message ProjectDocumentInput {
  string url = 1;
  TypedDocument type = 2;
}

/************** Requests/Responses **************/
message CreateProjectRequest {
  int32 eventId = 1;
  string name = 2;
  optional string description = 3;
  optional string eventNumber = 4;
  int32 courseId = 5;
  ProjectState state = 6; // opcional en la práctica; si no se envía, default en UC
}
message ProjectResponse { Project project = 1; }

message ProjectCompleteResponse { repeated ProjectComplete items = 1; }

message GetProjectRequest { int32 id = 1; }

message ListProjectsByEventRequest {
  int32 eventId = 1;
  optional string q = 2;
  optional int32 currentPage = 3;           // page number (1-indexed)
  optional int32 itemsPerPage = 4;          // items per page
  optional int32 courseId = 5;
  optional ProjectState state = 6;   // filter by project state
}
message ListProjectsResponse {
  repeated ProjectComplete items = 1;
  int32 total = 2;
  int32 currentPage = 3;           // current page number
  int32 itemsOnCurrentPage = 4;
  int32 itemsPerPage = 5;          // items per page
  int32 totalPages = 6;     // total number of pages
}
message UpdateProjectRequest {
  int32 id = 1;
  optional string name = 2;
  optional string description = 3;
  optional string eventNumber = 4;
  optional int32 courseId = 5;
  optional ProjectState state = 6;
}

message ApproveProjectRequest { int32 id = 1; int32 actingUserId = 2; }

message RejectProjectRequest { 
  int32 id = 1; 
  int32 actingUserId = 2;
  optional string reason = 3; // Reason for rejection (stored in database)
}

// Service will:
// 1. Validate all projects exist and belong to the same event
// 2. Call event-service to verify userId is a juror in that event
// 3. Get the full JurorKey (userId, eventId, roleId) from event-service
// 4. Assign juror to all valid projects
message AssignJurorToProjectsRequest {
  int32 userId = 1;              // The user to assign as juror
  repeated int32 projectIds = 2; // Projects to assign (must all be in same event)
}
message AssignJurorToProjectsResponse {
  int32 assigned = 1;
  repeated FailedAssignment failures = 2;
}
message FailedAssignment {int32 projectId = 1;string reason = 2;}

// Service will:
// 1. Get project to determine eventId
// 2. Validate both fromUserId and toUserId are jurors in that event
// 3. Get full JurorKey for both users from event-service
// 4. Remove old assignment and create new assignment
message ReassignProjectJurorRequest {
  int32 projectId = 1;
  int32 fromUserId = 2;  // Current juror userId
  int32 toUserId = 3;    // New juror userId
}
message ReassignProjectJurorResponse { bool ok = 1; bool changed = 2; }

message ListProjectJurorsRequest { int32 projectId = 1; }
message ListProjectJurorsResponse { repeated JurorKey jurors = 1; }

message IssueUploadUrlRequest { int32 projectId = 1; string contentType = 2; }
message IssueUploadUrlResponse { string uploadUrl = 1; string publicUrl = 2; }

message AddProjectDocumentFromUrlRequest { int32 projectId = 1; string url = 2; TypedDocument type = 3; }
message ProjectDocumentResponse { ProjectDocument document = 1; }

message ListProjectDocumentsRequest { int32 projectId = 1; }
message ListProjectDocumentsResponse { repeated ProjectDocument items = 1; }

message AddParticipantRequest {  int32 projectId = 1;  int32 userId = 2;  string studentCode = 3;}
message AddParticipantResponse {  ProjectParticipant participant = 1; }

message ListParticipantsRequest {  int32 projectId = 1; }
message ListParticipantsResponse {  repeated ProjectParticipant items = 1;}

message AddPendingParticipantRequest {
  int32 projectId = 1;
  string firstName = 2;
  optional string lastName = 3;
  string email = 4;
  string studentCode = 5;
  string status = 6;
}
message AddPendingParticipantResponse {
  PendingProjectParticipant participant = 1;
}

message ListPendingParticipantsRequest {  int32 projectId = 1; }
message ListPendingParticipantsResponse {  repeated PendingProjectParticipant items = 1;}

message CreateProjectWithParticipantsRequest {
  int32 eventId = 1;
  string name = 2;
  optional string description = 3;
  optional string eventNumber = 4;
  int32 courseId = 5;
  optional ProjectState state = 6; // Optional - backend defaults to UNDER_REVIEW for public submissions
  repeated PendingParticipantInput participants = 7;
  repeated ProjectDocumentInput documents = 8;
}

message CreateProjectWithParticipantsResponse {
  Project project = 1;
  repeated PendingProjectParticipant participants = 2;
  repeated ProjectDocument documents = 3;
}

message ListAssignedProjectsRequest {
  JurorKey juror = 1;
  int32 page = 2;             // número de página
  int32 page_size = 3;        // cantidad de ítems por página
}

message ListAssignedProjectsResponse {
  repeated ProjectComplete items = 1; // proyectos asignados al jurado
  int32 total = 2;            // total de proyectos
  int32 page = 3;
  int32 pageSize = 4;
}

message DeleteProjectRequest { int32 id = 1; }
message DeleteProjectResponse { bool ok = 1; }

message ListProjectsForReviewRequest  { 
  int32 eventId = 1;
  optional string q = 2;
  optional int32 currentPage = 3;           // page number (1-indexed)
  optional int32 itemsPerPage = 4;          // items per page
  optional int32 courseId = 5;
  }
message ListProjectsForReviewResponse { 
  repeated ProjectComplete items = 1;
  int32 total = 2;
  int32 currentPage = 3;           // current page number
  int32 itemsOnCurrentPage = 4;
  int32 itemsPerPage = 5;          // items per page
  int32 totalPages = 6;     // total number of pages
  }
  
message UpdateProjectDocumentRequest {
  int32 id = 1;           // ID del documento
  optional string url = 2;         // si viene vacío, no lo cambias
  optional TypedDocument type = 3;  // si viene DOCUMENT_TYPE_UNSPECIFIED, no lo cambias
  optional DocumentStatus state = 4; // igual idea
}

message GetMyProjectByEventRequest {
  int32 eventId = 1;
  int32 userId = 2;
}

message GetMyProjectByEventResponse {
  ProjectComplete project = 1;
}
