services:
  # PostgreSQL Databases - no exposed ports (internal only)
  auth-db:
    environment:
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}

  evaluation-db:
    environment:
      POSTGRES_PASSWORD: ${EVALUATION_DB_PASSWORD}

  event-db:
    environment:
      POSTGRES_PASSWORD: ${EVENT_DB_PASSWORD}

  invitation-db:
    environment:
      POSTGRES_PASSWORD: ${INVITATION_DB_PASSWORD}

  project-db:
    environment:
      POSTGRES_PASSWORD: ${PROJECT_DB_PASSWORD}

  # NestJS Services - Production mode
  auth-service:
    build:
      target: production
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@auth-db:5432/auth_service}
      - GRPC_HOST=${GRPC_HOST:-0.0.0.0}
      - GRPC_PORT=${GRPC_PORT:-50051}
      - NODE_ENV=${NODE_ENV:-production}
      - JWT_PRIVATE_KEY=${JWT_PRIVATE_KEY}
      - JWT_REFRESH_PRIVATE_KEY=${JWT_REFRESH_PRIVATE_KEY}
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY}
      - JWT_REFRESH_PUBLIC_KEY=${JWT_REFRESH_PUBLIC_KEY}
      - JWT_ACCESS_TOKEN_EXPIRATION=${JWT_ACCESS_TOKEN_EXPIRATION:-15m}
      - JWT_REFRESH_TOKEN_EXPIRATION=${JWT_REFRESH_TOKEN_EXPIRATION:-7d}
      - JWT_REFRESH_TOKEN_EXPIRATION_DAYS=${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:-7}
      - NOTIFICATION_SERVICE_URL=${NOTIFICATION_SERVICE_URL}
      - PASSWORD_RESET_TOKEN_EXPIRY_MINUTES=${PASSWORD_RESET_TOKEN_EXPIRY_MINUTES:-15}
    command: sh -c "npx prisma generate --schema=./apps/auth-service/prisma/schema.prisma && npx prisma migrate deploy --schema=./apps/auth-service/prisma/schema.prisma && npx prisma db seed && node dist/apps/auth-service/main"
    restart: always

  evaluation-service:
    build:
      target: production
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - DATABASE_URL=${EVALUATION_DATABASE_URL}
      - GRPC_HOST=${GRPC_HOST:-0.0.0.0}
      - GRPC_PORT=${GRPC_PORT:-50052}
    restart: always

  event-service:
    build:
      target: production
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - DATABASE_URL=${EVENT_DATABASE_URL}
      - GRPC_HOST=${GRPC_HOST:-0.0.0.0}
      - GRPC_PORT=${GRPC_PORT:-50053}
    restart: always

  invitation-service:
    build:
      target: production
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - DATABASE_URL=${INVITATION_DATABASE_URL}
      - GRPC_HOST=${GRPC_HOST:-0.0.0.0}
      - GRPC_PORT=${GRPC_PORT:-50054}
    restart: always

  project-service:
    build:
      target: production
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - DATABASE_URL=${PROJECT_DATABASE_URL}
      - GRPC_HOST=${GRPC_HOST:-0.0.0.0}
      - GRPC_PORT=${GRPC_PORT:-50055}
    restart: always

  gateway:
    build:
      target: production
    environment:
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL:-auth-service:50051}
      - EVALUATION_SERVICE_URL=${EVALUATION_SERVICE_URL:-evaluation-service:50052}
      - EVENT_SERVICE_URL=${EVENT_SERVICE_URL:-event-service:50053}
      - INVITATION_SERVICE_URL=${INVITATION_SERVICE_URL:-invitation-service:50054}
      - PROJECT_SERVICE_URL=${PROJECT_SERVICE_URL:-project-service:50055}
      - NODE_ENV=${NODE_ENV:-production}
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY}
      - JWT_REFRESH_PUBLIC_KEY=${JWT_REFRESH_PUBLIC_KEY}
      - JWT_ACCESS_TOKEN_EXPIRATION=${JWT_ACCESS_TOKEN_EXPIRATION:-15m}
      - JWT_REFRESH_TOKEN_EXPIRATION=${JWT_REFRESH_TOKEN_EXPIRATION:-7d}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - AZURE_BLOB_SAS_URL=${AZURE_BLOB_SAS_URL}
      - AZURE_ACCOUNT_NAME=${AZURE_ACCOUNT_NAME}
      - AZURE_ACCOUNT_KEY=${AZURE_ACCOUNT_KEY}
      - AZURE_CONTAINER=${AZURE_CONTAINER}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    ports:
      - "80:3000"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  notification-service:
    build:
      target: production 
    environment:
      - NODE_ENV=production
      - EMAIL_SERVICE_ID=${EMAIL_SERVICE_ID}
      - EMAIL_TEMPLATE_ID=${EMAIL_TEMPLATE_ID}
      - EMAIL_PUBLIC_KEY=${EMAIL_PUBLIC_KEY}
      - EMAIL_PRIVATE_KEY=${EMAIL_PRIVATE_KEY}
    restart: always
    
  redis:
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    restart: always
